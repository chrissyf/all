[project]
name = "app"
version = "0.1.0"
description = "Starter package for the Python workspace."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
app = "app.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults plus bugbear, comprehensions, pyupgrade, isort, and simplify.
select = ["E", "F", "W", "B", "C4", "UP", "I", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
