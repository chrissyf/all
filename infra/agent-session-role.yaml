AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Time boxed administrative role for agent sessions. Replaces the practice of
  placing a long lived IAM access key with AdministratorAccess directly into an
  agent environment, where the credential never expires and is readable by
  anything running in the container.

Parameters:
  TrustedUserName:
    Type: String
    Default: christian
    Description: >-
      Name of the IAM user permitted to assume the agent session role. This is
      the identity signed in to day to day, held at low privilege and elevating
      through the role only when it needs to.

  AdditionalTrustedUserName:
    Type: String
    Default: christianAdmin
    Description: >-
      A second IAM user also permitted to assume the role. Exists so the trusted
      identity can be changed without a gap: trust both, verify the new one
      works, then set this to an empty string to drop the old one. Leave empty
      when only one user should hold the entry point.

  RoleName:
    Type: String
    Default: agent-session-admin
    Description: Name of the role that agent sessions assume.

  MaxSessionSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: >-
      Upper bound on a session's lifetime, in seconds. AWS permits 3600 to
      43200. Credentials stop working once this elapses.

  RequireMFA:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      When true, the role is assumable only by a caller who authenticated with
      MFA. Keep this false for non interactive agent sessions, which have no
      way to answer an MFA prompt.

  AttachAssumeOnlyPolicy:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      When true, attach the assume only policy to the trusted user. This is
      purely additive while AdministratorAccess is still attached to that user,
      so deploying it cannot remove access. Detaching AdministratorAccess is a
      separate manual step, documented in the README.

Conditions:
  MfaRequired: !Equals [!Ref RequireMFA, "true"]
  ManageTrustedUserPolicy: !Equals [!Ref AttachAssumeOnlyPolicy, "true"]
  HasAdditionalUser: !Not [!Equals [!Ref AdditionalTrustedUserName, ""]]

Resources:
  AgentSessionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >-
        Assumed by agent sessions in place of a standing access key. Grants
        AdministratorAccess for the duration of a single session only.
      MaxSessionDuration: !Ref MaxSessionSeconds
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - HasAdditionalUser
                - - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${TrustedUserName}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${AdditionalTrustedUserName}"
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${TrustedUserName}"
            Action: sts:AssumeRole
            Condition: !If
              - MfaRequired
              - Bool:
                  aws:MultiFactorAuthPresent: "true"
              - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      Tags:
        - Key: purpose
          Value: agent-session

  # Intended replacement for AdministratorAccess on the trusted user. Attaching
  # it is additive and therefore safe on its own: while AdministratorAccess is
  # still attached the user keeps every permission it had, because IAM takes the
  # union of allows. Privilege only drops at the point AdministratorAccess is
  # detached, which is deliberately left as a manual step so it can be done
  # after verifying that role assumption works.
  AgentAssumeOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ManageTrustedUserPolicy
    Properties:
      ManagedPolicyName: agent-session-assume-only
      Description: >-
        Permits assuming the agent session role and managing the caller's own
        sign in credentials, and nothing else.
      Users: !If
        - HasAdditionalUser
        - [!Ref TrustedUserName, !Ref AdditionalTrustedUserName]
        - [!Ref TrustedUserName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeAgentSessionRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt AgentSessionRole.Arn

          # Without this the user cannot rotate its own key or change its own
          # password once AdministratorAccess is gone, which would make routine
          # credential hygiene require a role switch every time. Scoped to the
          # calling user only, via the aws:username policy variable.
          - Sid: ManageOwnCredentials
            Effect: Allow
            Action:
              - iam:ChangePassword
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:GetUser
              - iam:ListAccessKeys
              - iam:UpdateAccessKey
              - iam:ListMFADevices
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}"

          # Read only context the console needs to render a usable sign in and
          # security credentials page.
          - Sid: ReadAccountContext
            Effect: Allow
            Action:
              - iam:GetAccountPasswordPolicy
              - iam:ListAccountAliases
            Resource: "*"

          # The AWS CLI's browser based sign in (aws login) exchanges an
          # authorization code for short lived credentials, and needs these two
          # actions to do it. AdministratorAccess covered them implicitly, so
          # removing it broke credential refresh for any profile configured that
          # way. Granting them here restores that path without restoring admin.
          - Sid: BrowserSignIn
            Effect: Allow
            Action:
              - signin:AuthorizeOAuth2Access
              - signin:CreateOAuth2Token
            Resource: "*"

  # Ceiling on what the trusted user can ever hold, regardless of what is
  # attached to it later. Detaching AdministratorAccess removes today's standing
  # privilege but does not stop it being reattached, nor stop a new key on the
  # user inheriting whatever is attached at the time. A boundary makes the
  # reduced state durable: effective permissions are the intersection of the
  # attached policies and this document, so reattaching AdministratorAccess
  # would grant nothing beyond what is listed here.
  #
  # The statements deliberately mirror AgentAssumeOnlyPolicy. A boundary narrower
  # than the attached policy would break current function, so the two must be
  # kept in step; a boundary grants nothing on its own.
  #
  # Creating this policy has no effect until it is attached with
  # iam:PutUserPermissionsBoundary. See the README.
  AgentSessionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: agent-session-boundary
      Description: >-
        Permissions ceiling for the agent session user. Caps the user at
        assuming the agent session role and managing its own sign in
        credentials, whatever else may be attached to it.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeAgentSessionRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt AgentSessionRole.Arn

          - Sid: ManageOwnCredentials
            Effect: Allow
            Action:
              - iam:ChangePassword
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:GetUser
              - iam:ListAccessKeys
              - iam:UpdateAccessKey
              - iam:ListMFADevices
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${!aws:username}"

          - Sid: ReadAccountContext
            Effect: Allow
            Action:
              - iam:GetAccountPasswordPolicy
              - iam:ListAccountAliases
            Resource: "*"

          - Sid: BrowserSignIn
            Effect: Allow
            Action:
              - signin:AuthorizeOAuth2Access
              - signin:CreateOAuth2Token
            Resource: "*"

Outputs:
  RoleArn:
    Description: ARN of the agent session role.
    Value: !GetAtt AgentSessionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"

  AssumeRoleCommand:
    Description: Command that mints a short lived session from this role.
    Value: !Sub >-
      aws sts assume-role --role-arn ${AgentSessionRole.Arn}
      --role-session-name agent --duration-seconds ${MaxSessionSeconds}

  ConsoleSwitchRoleUrl:
    Description: Console URL for switching into the agent session role.
    Value: !Sub >-
      https://signin.aws.amazon.com/switchrole?account=${AWS::AccountId}&roleName=${RoleName}&displayName=${RoleName}

  AssumeOnlyPolicyArn:
    Condition: ManageTrustedUserPolicy
    Description: >-
      Policy intended to replace AdministratorAccess on the trusted user.
    Value: !Ref AgentAssumeOnlyPolicy

  BoundaryPolicyArn:
    Description: >-
      Permissions boundary for the trusted user. Inert until attached with
      iam:PutUserPermissionsBoundary.
    Value: !Ref AgentSessionBoundary

  SetBoundaryCommand:
    Description: Command that applies the boundary to the trusted user.
    Value: !Sub >-
      aws iam put-user-permissions-boundary --user-name ${TrustedUserName}
      --permissions-boundary ${AgentSessionBoundary}
