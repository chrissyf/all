[workspace]
resolver = "3"
members = ["crates/*"]

# Shared metadata. Member crates opt in with `field.workspace = true`
# so version and edition bumps happen in one place.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# Shared dependency versions. Members reference these with
# `some-crate.workspace = true` rather than pinning their own.
[workspace.dependencies]

# Lints applied across every member via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
